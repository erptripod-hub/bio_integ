[project]
name = "bio_integ"
authors = [
    { name = "Riane", email = "riane@example.com" }
]
description = "Biometric Integration"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "bio_integ"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
